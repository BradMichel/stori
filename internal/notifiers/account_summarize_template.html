<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Summary</title>
</head>
<body>
    <h1>Account Summary for {{.ID}}</h1>
    <p>Total Balance: {{.TotalBalance}}</p>
    <p>Average Debit Amount: {{.AverageDebitAmount}}</p>
    <p>Average Credit Amount: {{.AverageCreditAmount}}</p>
    <h2>Monthly Summary</h2>
    {{range .Months}}
    <h3>Month: {{.Month}}</h3>
    <p>Number of Transactions: {{.NTransactions}}</p>
    {{end}}
    <div><img data-imagetype="External" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbTFvM2QzZjZ0NmR4bzFoNHVicXV3c2tvdmxpbTI3bmk0a25iaTdhNCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/VXWN05HTttWxoCnXdP/source.gif" width="200" height="110" alt="stori"><br>
    </div>
</body>
</html>
